# Day Skies walkthrough (https://daybrite.dev/docs/dayscript).
#
# Run against deterministic mock data so screenshots are reproducible across runs and locales:
#
#     day launch -t macos-appkit --env WEATHER_MOCK=1 --script scripts/weather.yaml
#     day launch -t macos-appkit --env WEATHER_MOCK=1 --locale ar --script scripts/weather.yaml
#
# Screenshots land in build/day/screenshots/<target>/<locale-or-default>/<name>.png
name: day-skies-walkthrough
description: Visit each city with mock data; assert hero content; capture per-city screenshots.
flow:
  # The nav host and the first city (San Francisco) mount immediately.
  - wait_for: { id: nav }
  - wait_for: { id: hero_temp }

  # Establish Celsius before asserting any temperature. The unit is a persisted preference, so
  # it is inherited from whatever ran last, and this script switches it to Fahrenheit half way
  # through. Restoring it at the end (which this script also does) is not enough on its own: a run
  # that fails, is cancelled, or has its app killed between the switch and the restore leaves
  # Fahrenheit in the store, and every later run then fails its first five assertions on a stale
  # setting rather than on anything it did. CI runs four locales back to back through one store,
  # so one bad run used to poison the rest.
  # `settings/<group>` is the settings surface's route (docs/settings.md): on desktop it opens
  # the Settings window on that group; on the phones and the web it selects the sidebar's
  # Settings section and pushes the group's page. The unit row is a segmented choice everywhere.
  - navigate: { route: settings/weather }
  - wait_for: { id: unit_picker }
  - select: { id: unit_picker, index: 0 }
  - navigate: { route: san-francisco }
  - wait_for: { id: hero_temp }

  - assert_text: { id: hero_city, key: city_san_francisco }
  - assert_text: { id: hero_temp, text: "18°" }
  - assert_visible: { id: hourly }
  - assert_visible: { id: ten_day }
  - screenshot: san-francisco

  - navigate: { route: new-york }
  - wait_for: { id: hero_temp }
  - assert_text: { id: hero_temp, text: "27°" }
  - screenshot: new-york

  - navigate: { route: london }
  - wait_for: { id: hero_temp }
  - assert_text: { id: hero_temp, text: "14°" }
  - screenshot: london

  # Tokyo's mock clock is night → moon glyph + night sky.
  - navigate: { route: tokyo }
  - wait_for: { id: hero_temp }
  - assert_text: { id: hero_temp, text: "24°" }
  - screenshot: tokyo

  - navigate: { route: sydney }
  - wait_for: { id: hero_temp }
  - assert_text: { id: hero_temp, text: "12°" }
  - screenshot: sydney

  # Settings ▸ General: the language row exists everywhere (the appearance row only where the
  # toolkit honors a runtime override, so it is never asserted). The screenshot is the Settings
  # window on desktop and the pushed page on the phones and the web.
  - navigate: { route: settings/general }
  - wait_for: { id: language_picker }
  - screenshot: { name: settings, window: day.preferences, only_on: [appkit, gtk, qt, winui, xaml] }
  - screenshot: { name: settings, skip_on: [appkit, gtk, qt, winui, xaml] }

  # About: the `about` route opens the window on desktop; on the phones and the web the header
  # card at the top of the settings root page opens the About page. The version comes from the
  # manifest and is never asserted by value. GNOME shows libadwaita's own About dialog, which
  # has no Day tree to assert, so the block is skipped there.
  - navigate: { route: about, only_on: [appkit, qt, winui, xaml] }
  - navigate: { route: settings, skip_on: [appkit, gtk, qt, winui, xaml] }
  - tap: { id: settings_about, skip_on: [appkit, gtk, qt, winui, xaml] }
  - wait_for: { id: about_version, skip_on: [gtk] }
  - screenshot: { name: about, window: day.about, only_on: [appkit, qt, winui, xaml] }
  - screenshot: { name: about, skip_on: [appkit, gtk, qt, winui, xaml] }
  - close_window: { window: day.about, only_on: [appkit, qt, winui, xaml] }

  # Settings ▸ Weather: switch to Fahrenheit and verify the temperature labels re-render
  # reactively (mock San Francisco is 18°C = 64°F), then restore Celsius so reruns stay
  # deterministic (the unit is a persisted preference).
  - navigate: { route: settings/weather }
  - wait_for: { id: unit_picker }
  - assert_visible: { id: host_field }
  - assert_visible: { id: settings_refresh }
  - screenshot: { name: settings-weather, window: day.preferences, only_on: [appkit, gtk, qt, winui, xaml] }
  - screenshot: { name: settings-weather, skip_on: [appkit, gtk, qt, winui, xaml] }
  - select: { id: unit_picker, index: 1 }
  - navigate: { route: san-francisco }
  - wait_for: { id: hero_temp }
  - assert_text: { id: hero_temp, text: "64°" }
  - screenshot: san-francisco-fahrenheit
  - navigate: { route: settings/weather }
  - wait_for: { id: unit_picker }
  - select: { id: unit_picker, index: 0 }
  - navigate: { route: san-francisco }
  - assert_text: { id: hero_temp, text: "18°" }

  # Settings ▸ Cities: add a custom city by coordinates (unknown ids get the fixed 20 °C mock
  # fixture), visit it, then remove it so reruns start from the same list. The preset add is
  # exercised against the default picker selection (San Francisco, already on the list) so the
  # flow needs no synthetic picker select; the location button is asserted present but never
  # tapped; a real permission prompt would hang an unattended run.
  - navigate: { route: settings/cities }
  - wait_for: { id: city_name }
  - assert_visible: { id: city_locate }
  - input: { id: city_name, text: "Testville" }
  - input: { id: city_lat, text: "10" }
  - input: { id: city_lon, text: "20" }
  - tap: { id: city_save }
  - assert_text: { id: city_status, key: cities_status_saved }
  - navigate: { route: testville }
  - wait_for: { id: hero_temp }
  - assert_text: { id: hero_city, text: "Testville" }
  - assert_text: { id: hero_temp, text: "20°" }
  - screenshot: testville
  # Back to the city editor. The desktop window selects the group by route; the navigation
  # presentation is still on the Cities page it was left on, so selecting the section is enough
  # (routing to the group again would push a second copy of the page above the first).
  - navigate: { route: settings/cities, only_on: [appkit, gtk, qt, winui, xaml] }
  - navigate: { route: settings, skip_on: [appkit, gtk, qt, winui, xaml] }
  - wait_for: { id: city_name }
  - tap: { id: city_add_preset }
  - assert_text: { id: city_status, key: cities_status_exists }
  # The city rows live in a recycling list (docs/list.md): rows realize lazily as the list
  # becomes visible, so reveal it before addressing a row that may sit below the fold. The
  # desktop Settings window fits its page instead of scrolling, so there is nothing to reveal.
  - scroll_to: { id: city_rows, skip_on: [appkit, gtk, qt, winui, xaml] }
  - tap: { id: city_remove:testville }
  - assert_text: { id: city_status, key: cities_status_removed }
  # Drag-to-reorder rides the same list: move Sydney (index 4) to the top and back, asserting
  # through the sidebar-order-follows-the-list contract (the first nav row is the first city).
  - reorder: { id: city_rows, from: 4, to: 0 }
  - reorder: { id: city_rows, from: 0, to: 4 }

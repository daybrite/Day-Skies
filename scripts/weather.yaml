# Day Skies walkthrough (https://daybrite.dev/docs/dayscript).
#
# Run against deterministic mock data so screenshots are reproducible across runs and locales:
#
#     day launch -p macos-appkit --env WEATHER_MOCK=1 --script scripts/weather.yaml
#     day launch -p macos-appkit --env WEATHER_MOCK=1 --locale ar --script scripts/weather.yaml
#
# Screenshots land in build/day/screenshots/<target>/<locale-or-default>/<name>.png
name: day-skies-walkthrough
description: Visit each city with mock data; assert hero content; capture per-city screenshots.
flow:
  # The nav host and the first city (San Francisco) mount immediately.
  - wait_for: { id: nav }
  - wait_for: { id: hero-temp }

  # Establish Celsius before asserting any temperature. The unit persists via day-part-prefs, so
  # it is inherited from whatever ran last, and this script toggles it to Fahrenheit half way
  # through. Restoring it at the end (which this script also does) is not enough on its own: a run
  # that fails, is cancelled, or has its app killed between the toggle and the restore leaves
  # Fahrenheit in the store, and every later run then fails its first five assertions on a stale
  # setting rather than on anything it did. CI runs four locales back to back through one store,
  # so one bad run used to poison the rest.
  - navigate: { route: settings }
  - wait_for: { id: unit-picker }
  - select: { id: unit-picker, index: 0 }
  - navigate: { route: san-francisco }
  - wait_for: { id: hero-temp }

  - assert_text: { id: hero-city, key: city_san_francisco }
  - assert_text: { id: hero-temp, text: "18°" }
  - assert_visible: { id: hourly }
  - assert_visible: { id: ten-day }
  - screenshot: san-francisco

  - navigate: { route: new-york }
  - wait_for: { id: hero-temp }
  - assert_text: { id: hero-temp, text: "27°" }
  - screenshot: new-york

  - navigate: { route: london }
  - wait_for: { id: hero-temp }
  - assert_text: { id: hero-temp, text: "14°" }
  - screenshot: london

  # Tokyo's mock clock is night → moon glyph + night sky.
  - navigate: { route: tokyo }
  - wait_for: { id: hero-temp }
  - assert_text: { id: hero-temp, text: "24°" }
  - screenshot: tokyo

  - navigate: { route: sydney }
  - wait_for: { id: hero-temp }
  - assert_text: { id: hero-temp, text: "12°" }
  - screenshot: sydney

  # Settings: switch to Fahrenheit and verify the temperature labels re-render reactively
  # (mock San Francisco is 18°C = 64°F), then restore Celsius so reruns stay deterministic
  # (the unit persists via day-part-prefs).
  - navigate: { route: settings }
  - wait_for: { id: unit-picker }
  - assert_visible: { id: host-field }
  # The About section: version and the GitHub link render; the build date and link are never
  # asserted by value (date drifts, and tapping the link would open a browser). The theme
  # picker is not asserted, because backends without Cap::Appearance hide that section.
  - assert_visible: { id: about-version }
  - assert_visible: { id: about-github }
  - assert_visible: { id: language-picker }
  - screenshot: settings
  - select: { id: unit-picker, index: 1 }
  - navigate: { route: san-francisco }
  - wait_for: { id: hero-temp }
  - assert_text: { id: hero-temp, text: "64°" }
  - screenshot: san-francisco-fahrenheit
  - navigate: { route: settings }
  - wait_for: { id: unit-picker }
  - select: { id: unit-picker, index: 0 }
  - navigate: { route: san-francisco }
  - assert_text: { id: hero-temp, text: "18°" }

  # City management (on the Settings page): add a custom city by coordinates (unknown ids
  # get the fixed 20 °C mock fixture), visit it, then remove it so reruns start from the same
  # list. The preset add is exercised against the default picker selection (San Francisco,
  # already on the list) so the flow needs no synthetic picker select; the location button is
  # asserted present but never tapped; a real permission prompt would hang an unattended run.
  - navigate: { route: settings }
  - wait_for: { id: city-name }
  - assert_visible: { id: city-locate }
  - input: { id: city-name, text: "Testville" }
  - input: { id: city-lat, text: "10" }
  - input: { id: city-lon, text: "20" }
  - tap: { id: city-save }
  - assert_text: { id: city-status, key: cities_status_saved }
  - navigate: { route: testville }
  - wait_for: { id: hero-temp }
  - assert_text: { id: hero-city, text: "Testville" }
  - assert_text: { id: hero-temp, text: "20°" }
  - screenshot: testville
  - navigate: { route: settings }
  - wait_for: { id: city-name }
  - tap: { id: city-add-preset }
  - assert_text: { id: city-status, key: cities_status_exists }
  # The city rows live in a recycling list (docs/list.md): rows realize lazily as the list
  # becomes visible, so reveal it before addressing a row that may sit below the fold.
  - scroll_to: { id: city-rows }
  - tap: { id: city-remove-testville }
  - assert_text: { id: city-status, key: cities_status_removed }
  # Drag-to-reorder rides the same list: move Sydney (index 4) to the top and back, asserting
  # through the sidebar-order-follows-the-list contract (the first nav row is the first city).
  - reorder: { id: city-rows, from: 4, to: 0 }
  - reorder: { id: city-rows, from: 0, to: 4 }

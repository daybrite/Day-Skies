# Day Skies website (https://daybrite.github.io/Day-Skies/) — built by the shared
# dayapp workflow from the daybrite/daysite template. Everything content-ful
# (name, description, screenshots, downloads) comes from Day.toml, store/, and the
# release pipeline; this file holds only what is genuinely site-specific.

host = "https://daybrite.github.io/Day-Skies"
locales = ["en", "fr", "ar", "zh-CN"]

# The sky-blue the app's own gradients open with.
accent-color = "#4A90D9"

# The hosted web build lives at /Day-Skies/webapp/ (the hero's "Open the web app" button).
webapp = "webapp"

# Web-first: the live build is one click away, so preselect it in the platform picker.
default-platform = "web"

# The backdrop is the sky, so opening it up behind the sun is what the artwork
# asks for.
icon-effect = "iris"

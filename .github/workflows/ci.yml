name: ci

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Marking a pre-release as a release (or publishing one) rebuilds the website against it.
  release:
    types: [released]
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *" # daily (UTC)

# The repository's own jobs run this checkout's code with a read-only token. The write grants
# sit on the job that calls the shared workflow, whose release and Pages jobs alone use them;
# its build legs, which run this code too, narrow their token to read-only themselves.
permissions:
  contents: read

jobs:
  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write # release-asset upload on tag builds
      pages: write    # web-dom → GitHub Pages (deploy-web)
      id-token: write # deploy-pages OIDC token (deploy-web)
    secrets: inherit
    with:
      targets: windows-winui, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-material, harmony-arkui, web-dom
      # Build against the tip of the day branch the app tracks, not the revision the committed
      # lock pins: a sample app exists to prove the current framework still builds it, and a
      # lock left at an older revision would silently stop testing day at all. The revision is
      # resolved once per run, so every leg compiles the same one. Refresh the lock locally
      # (`cargo update -p day`) when a new framework API lands, so a local build matches.
      update-day-deps: true
      scripts: scripts/weather.yaml
      launch-env: WEATHER_MOCK=1
      locales: en fr ar zh-CN
      # website/site.toml makes the workflow build and deploy the full project site
      # (https://daybrite.github.io/Day-Skies/) from the daybrite/daysite template on every push
      # to main, with the web build hosted at /Day-Skies/webapp/. deploy-web stays on as the
      # fallback: were website/ ever removed, the bare web app would return to the Pages root.
      deploy-web: true

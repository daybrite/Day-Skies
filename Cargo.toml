[package]
name = "day-skies"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
# Generate typed resource + localization constants (`res::str::…`) from `resource/` on every build.
build = "build.rs"

[features]
# The default `mock` backend lets bare `cargo build` / rust-analyzer compile out of the box;
# `day build` always passes `--no-default-features --features <backend>`, stripping it.
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
xaml = ["day/xaml"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests the iOS staticlib / Android cdylib
# explicitly via `cargo rustc --crate-type`.
[lib]
# A constant name, not the package's. Every artifact Day stages is named after the lib target
# (`libdayapp.a` for the iOS/macOS staticlib, `libdayapp.so` for the Android cdylib, and the
# `dayapp::` path `src/main.rs` imports), so none of them move when the package is renamed.
# Renaming this app is a one-line edit to `[package] name` above (DESIGN.md §17.5).
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# The day framework resolves from git (the crates aren't on crates.io yet). Local development
# against a checkout goes through the gitignored .cargo/config.toml [patch]; see README.
day = { package = "day-app", version = "0.6" }
# Settings and About (docs/settings.md): typed persisted preferences (unit, host, the city
# list) and the Settings/About surface in each platform's idiom.
day-piece-settings = "0.6"
# The platform HTTP stack (URLSession / HttpURLConnection / WinHTTP; ureq+rustls only on
# Linux/OHOS); system proxies, VPN, and TLS come from the OS, no TLS library in the app.
day-part-http = "0.6"
# Cities page: the "Use current location" one-shot fix (docs/location.md) and the permission
# ask that must precede it (docs/permissions.md); location never prompts by itself.
day-part-location = "0.6"
day-part-permissions = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
day-build = "0.6"


[workspace]

[workspace.package]
version = "0.1.7"
